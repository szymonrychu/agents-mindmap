image:
  repository: harbor.szymonrichert.pl/containers/agents-mindmap
  # Required: a semver X.Y.Z (deploy only released images; the chart appVersion is a sha).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Required: the base URL of agents-web, e.g. https://lab.szymonrichert.pl (not the /mindmap api).
# Fallback links are <publicBaseUrl>/mindmaps/M-<n>.
publicBaseUrl: ""

# Every secret value comes from an external Secret; the chart renders no Secret.
# Required: the Secret holding the DSN of the service's own database (agents-helmfile deploys it).
postgres:
  existingSecret: ""
  existingSecretKey: uri

# Required: the orchestrator service port and the token mindmap sends to it.
orchestrator:
  url: ""
  tokenSecret:
    name: ""
    key: token

# Required: the bearer token the service listener verifies (the orchestrator relay sends it).
relayTokenSecret:
  name: ""
  key: token

# Optional: the bearer token list (comma separated) of the delegate listener, a cluster-only
# user api. The delegate port and its Service are rendered only when the name is set.
delegate:
  tokensSecret:
    name: ""
    key: tokens

# Optional: the taskboard delegate listener mindmap notifies; empty url turns the notifier off.
# The token Secret is required when the url is set.
taskboard:
  url: ""
  tokenSecret:
    name: ""
    key: token

# Optional: the OpenAI-shaped embeddings endpoint; empty turns semantic search off.
embedder:
  url: ""
  # The embedder process (singleton). Off by default; agents-helmfile enables it together with
  # the embeddings server. Needs embedder.url.
  enabled: false
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 256Mi}

# The notifier process (singleton): drains the task-change and direction outboxes to the
# taskboard and, for the direction fallback, to the orchestrator. Off by default; agents-helmfile
# enables it. Needs taskboard.url.
notifier:
  enabled: false
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}

# SSO for the web listener: the cluster's oauth2-proxy admission webhook injects the sidecar
# from these pod annotations. They are set on the web Deployment only; the service and delegate
# listeners run in their own pods, bearer-gated and never reached through it.
oauth2Proxy:
  enabled: false
  redeemUrl: ""
  secretName: ""
  secretNamespace: ""

# Source CIDRs allowed on the web listener (the oauth2-proxy sidecar reaches it from loopback).
allowedCidrs:
  - 127.0.0.1/32

# Extra MINDMAP_* settings; keys must start with MINDMAP_.
env: {}

ports:
  web: 8080
  delegate: 8081
  service: 8082

# One Deployment per listener: web (`mindmap serve-web`, the only one behind oauth2), service
# (`serve-service`, relay bearer) and delegate (`serve-delegate`, only with a delegate token Secret).
components:
  web:
    replicas: 1
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  service:
    replicas: 1
    podAnnotations: {}
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 256Mi}
  delegate:
    replicas: 1
    podAnnotations: {}
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 256Mi}

podLabels: {}
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The api is routed under /mindmap on the shared host; only the web listener is routed.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /mindmap
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
