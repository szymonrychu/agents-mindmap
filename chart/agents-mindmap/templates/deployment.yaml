{{- $tag := include "agents-mindmap.imageTag" . }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- /* One Deployment per listener (the sibling pattern of agents-vault and agents-taskboard):
the oauth2-proxy admission webhook protects the first port of the first container of a pod, so
only the web pod carries its annotations; the service and delegate listeners stay in-cluster
and bearer-gated, each pod holding only the token it verifies. */ -}}
{{- $components := list "web" "service" }}
{{- if include "agents-mindmap.delegateEnabled" . }}
{{- $components = append $components "delegate" }}
{{- end }}
{{- range $component := $components }}
{{- $cfg := index $.Values.components $component }}
{{- $port := index $.Values.ports $component }}
{{- $labels := dict "context" $ "component" $component }}
{{- $secrets := dict "web" (list "orchestrator") "service" (list "orchestrator" "relay") "delegate" (list "orchestrator" "delegate") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-mindmap.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-mindmap.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $cfg.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "agents-mindmap.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- if eq $component "web" }}
        {{- with (include "agents-mindmap.oauth2Annotations" $) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-mindmap.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-mindmap.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "agents-mindmap.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["mindmap"]
          args: ["migrate"]
          {{- include "agents-mindmap.env" (dict "ctx" $ "secrets" (list)) | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["mindmap"]
          args: [{{ printf "serve-%s" $component | quote }}]
          {{- include "agents-mindmap.env" (dict "ctx" $ "secrets" (index $secrets $component)) | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          {{- /* by number: the oauth2-proxy webhook gives the name http to its sidecar */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $port }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
