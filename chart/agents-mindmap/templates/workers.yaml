{{- /* Singleton processes (advisory lock): one replica, never two pods at once. Off by default. */ -}}
{{- $tag := include "agents-mindmap.imageTag" . }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- $workers := list }}
{{- if .Values.notifier.enabled }}
{{- if not .Values.taskboard.url }}{{ fail "agents-mindmap: notifier.enabled needs taskboard.url" }}{{ end }}
{{- $workers = append $workers "notifier" }}
{{- end }}
{{- if .Values.embedder.enabled }}
{{- if not .Values.embedder.url }}{{ fail "agents-mindmap: embedder.enabled needs embedder.url" }}{{ end }}
{{- $workers = append $workers "embedder" }}
{{- end }}
{{- range $worker := $workers }}
{{- $cfg := index $.Values $worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-mindmap.fullname" $ }}-{{ $worker }}
  labels:
    {{- include "agents-mindmap.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $worker }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agents-mindmap.componentLabels" (dict "context" $ "component" $worker) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
      labels:
        {{- include "agents-mindmap.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $worker }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-mindmap.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "agents-mindmap.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $worker }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["mindmap"]
          args: [{{ $worker | quote }}]
          {{- include "agents-mindmap.env" (dict "ctx" $ "secrets" (ternary (list "taskboard") (list) (eq $worker "notifier"))) | nindent 10 }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
